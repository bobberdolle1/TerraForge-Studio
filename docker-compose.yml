# Development / single-host stack for TerraForge Studio.
#
# One container serving the API and the built frontend on port 8000. Nothing
# else is required: SRTM elevation and Overpass vector data need no API key,
# results are cached on disk, and the batch queue is in-process.
#
#   docker compose up -d      →  http://localhost:8000
#
# For a TLS-terminated deployment with monitoring, see
# docker-compose.prod.yml.

services:
  terraforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraforge-studio
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      OUTPUT_DIR: /app/output
      CACHE_DIR: /app/cache
      TEMP_DIR: /app/temp
      # Accounts and the credential encryption key live on their own volume so
      # clearing the cache never takes them with it.
      AUTH_STORAGE_FILE: /app/data/users.json
      SETTINGS_STORAGE_FILE: /app/data/settings.json
      SECRET_KEY_FILE: /app/data/.secret_key
      # Optional providers - set them here or in a .env file next to this one.
      # OPENTOPOGRAPHY_API_KEY: ${OPENTOPOGRAPHY_API_KEY:-}
      # OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - terraforge_cache:/app/cache
      - terraforge_output:/app/output
      - terraforge_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - terraforge-network

  # Optional reverse proxy on port 80, adding rate limiting and long
  # proxy timeouts for generation. Start with `--profile proxy`.
  nginx:
    image: nginx:alpine
    container_name: terraforge-nginx
    profiles: ["proxy"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - terraforge
    restart: unless-stopped
    networks:
      - terraforge-network

volumes:
  terraforge_cache:
    driver: local
  terraforge_output:
    driver: local
  terraforge_data:
    driver: local

networks:
  terraforge-network:
    driver: bridge
