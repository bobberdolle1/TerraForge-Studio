# Production stack for TerraForge Studio.
#
# One application container serving both the API and the built frontend, an
# nginx reverse proxy terminating TLS, and an optional monitoring pair.
#
# There is no database, cache server or task broker here because the
# application uses none: generation state is in-process, results are cached on
# disk under CACHE_DIR, and the batch queue is in-memory. Earlier revisions of
# this file ran PostgreSQL, Redis and two Celery services against
# `realworldmapgen.tasks`, a module that does not exist.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Credentials come from a .env file next to this one - see .env.example.

services:
  terraforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraforge-studio
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      OUTPUT_DIR: /app/output
      CACHE_DIR: /app/cache
      TEMP_DIR: /app/temp
      # Accounts and the credential encryption key. On a persistent volume so
      # that a rebuild does not log everyone out or lose stored API keys.
      AUTH_STORAGE_FILE: /app/data/users.json
      SETTINGS_STORAGE_FILE: /app/data/settings.json
      SECRET_KEY_FILE: /app/data/.secret_key
      # Enable behind the proxy below, which overwrites X-Forwarded-For.
      RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
    volumes:
      - terraforge_output:/app/output
      - terraforge_cache:/app/cache
      - terraforge_data:/app/data
    expose:
      - "8000"
    restart: always
    networks:
      - terraforge-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: terraforge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - terraforge
    restart: always
    networks:
      - terraforge-network

  # Optional: scrapes /metrics, which the application really exposes.
  # Start with `--profile monitoring`.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: always
    networks:
      - terraforge-network

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always
    networks:
      - terraforge-network

volumes:
  terraforge_output:
    driver: local
  terraforge_cache:
    driver: local
  terraforge_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  terraforge-network:
    driver: bridge
