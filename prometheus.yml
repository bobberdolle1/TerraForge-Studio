# Prometheus scrape configuration for TerraForge Studio.
#
# The application exposes /metrics itself, so it is scraped directly with no
# exporter sidecar. Earlier revisions listed postgres-, redis-, node- and
# nginx-exporter targets: the first two are for services this application does
# not use, and none of them are started by either compose file, so every one
# of those jobs sat permanently DOWN.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'terraforge'

scrape_configs:
  # The application. Service name comes from docker-compose.prod.yml.
  - job_name: 'terraforge'
    static_configs:
      - targets: ['terraforge:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
